name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"

      - name: Verify import and command-line entry points
        run: |
          python -c "import ramp_optimizer"
          python -c "from ramp_optimizer_api.app import app"
          python -m ramp_optimizer --help
          ramp-optimizer --help

      - name: Exercise the small benchmark harness
        run: python -m ramp_optimizer benchmark --scenario small --repeat 1 > small-benchmark.json

      - name: Run test suite
        run: python -m pytest
