[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-flight-optimizer"
version = "0.1.0"
description = "A deterministic synthetic ramp-team flight assignment optimizer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "ortools>=9.12,<10",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141,<0.142",
    "pydantic>=2.9,<3",
    "uvicorn>=0.52,<0.53",
]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<9",
]

[project.scripts]
ramp-optimizer = "ramp_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: end-to-end optimizer scenarios spanning multiple layers",
    "slow: bounded performance scenarios excluded from the fast feedback suite",
]
